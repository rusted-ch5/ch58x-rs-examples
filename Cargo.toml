[workspace]
members = [
    "examples/ch582-blinky",
    "examples/ch582-embassy-blinky",
    "examples/ch582-uart-echo",
    "examples/ch582-usb-hid",
    "examples/rmk-ch58x",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
embassy-ch58x = { git = "https://github.com/rusted-ch5/embassy-ch58x.git", rev = "0e7a7c75bf6871a9b40c08119c7dff713cfd7770", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
