name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87"
          targets: riscv32imc-unknown-none-elf
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build minimal HAL example
        run: cargo build --release -p ch582-blinky
      - name: Build Embassy example
        run: cargo build --release -p ch582-embassy-blinky
